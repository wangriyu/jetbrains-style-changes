name: Publish to Open VSX

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in package.json (leave off to validate the build)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run package:marketplace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-vsix
          path: dist/jetbrains-style-changes-*.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: open-vsx
    concurrency: publish-open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-vsix
          path: dist
      - name: Publish the built VSIX
        shell: bash
        run: |
          shopt -s nullglob
          packages=(dist/jetbrains-style-changes-*.vsix)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one VSIX, found ${#packages[@]}" >&2
            exit 1
          fi
          npx --yes ovsx@1.4.0 publish "${packages[0]}" --trusted-publishing
